<!DOCTYPE html>
<html>
<head>
    <title>设备配网</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F5F5F7">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(180deg, 
                #F2F0F5 0%,
                #F2F0F5 8%,
                #F8F0FF 18%,
                #F0E1FE 50%,
                #EEDFFE 100%
            );
            min-height: 100vh;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }
        .page {
            min-height: 100vh;
            padding: 0 20px 40px;
            max-width: 430px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            padding-top: 16px;
            padding-bottom: 20px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: #1F2937;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 14px;
            color: #8B5CF6;
            font-weight: 500;
        }
        
        .card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 48px 24px 32px;
            box-shadow: 
                0 1px 2px rgba(139, 92, 246, 0.05),
                0 8px 32px rgba(139, 92, 246, 0.08);
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #8B5CF6, #A78BFA, #C4B5FD);
        }
        
        /* 波纹容器 - 固定尺寸，所有元素绝对定位居中 */
        .success-icon-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 24px;
        }
        
        /* 波纹环 - 绝对定位居中 */
        .ripple-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #10B981;
            opacity: 0;
            animation: ripple 2s ease-out infinite;
        }
        .ripple-ring:nth-child(2) { animation-delay: 0.5s; }
        .ripple-ring:nth-child(3) { animation-delay: 1s; }
        @keyframes ripple {
            0% { width: 80px; height: 80px; opacity: 0.5; }
            100% { width: 160px; height: 160px; opacity: 0; }
        }
        
        /* 对勾图标容器 - 绝对定位居中，覆盖在波纹之上 */
        .success-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #D1FAE5 0%, #A7F3D0 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes scaleIn {
            from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .success-icon svg {
            width: 40px;
            height: 40px;
            color: #10B981;
            animation: checkDraw 0.6s ease 0.3s both;
        }
        @keyframes checkDraw {
            from { stroke-dashoffset: 30; }
            to { stroke-dashoffset: 0; }
        }
        
        .success-title {
            font-size: 22px;
            font-weight: 800;
            color: #1F2937;
            margin-bottom: 8px;
            animation: fadeInUp 0.5s ease 0.2s both;
        }
        .success-subtitle {
            font-size: 14px;
            color: #9CA3AF;
            margin-bottom: 8px;
            animation: fadeInUp 0.5s ease 0.3s both;
        }
        .success-detail {
            font-size: 13px;
            color: #A78BFA;
            margin-bottom: 40px;
            animation: fadeInUp 0.5s ease 0.4s both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            color: #FFFFFF;
            background: linear-gradient(135deg, #7C3AED 0%, #A855F7 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s ease 0.5s both;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-primary:active::after {
            left: 100%;
        }
        
        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            animation: confettiFall 3s ease-out forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <h1>设备配网</h1>
            <p>为你的设备连接 Wi-Fi 网络</p>
        </div>
        <div class="card">
            <div class="success-icon-wrapper">
                <div class="ripple-ring"></div>
                <div class="ripple-ring"></div>
                <div class="ripple-ring"></div>
                <div class="success-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
            </div>
            <div class="success-title">配网成功！</div>
            <div class="success-subtitle">设备已成功连接网络</div>
            <div class="success-detail">现在可以关闭此页面，开始使用你的设备</div>
            <button class="btn-primary" onclick="exitConfig()">完成</button>
        </div>
    </div>

    <script>
        function exitConfig() {
            fetch('/exit', { method: 'POST' })
                .then(() => {
                    console.log('Exit config mode request sent');
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        function createConfetti() {
            const colors = ['#8B5CF6', '#A78BFA', '#C4B5FD', '#10B981', '#34D399'];
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        window.addEventListener('load', function() {
            createConfetti();
            setTimeout(exitConfig, 2000);
        });
    </script>
</body>
</html>
