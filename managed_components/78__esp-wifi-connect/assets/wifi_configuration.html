<!DOCTYPE html>
<html>
<head>
    <title>设备配网</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F5F5F7">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            /* 关键：从标题栏相近的浅灰色开始，向下渐变到紫色 */
            background: linear-gradient(180deg, 
                #F2F0F5 0%,      /* 标题栏颜色 */
                #F2F0F5 8%,      /* 保持一段浅灰，和标题栏衔接 */
                #F8F0FF 18%,     /* 开始过渡到淡紫 */
                #F0E1FE 50%,     /* 紫色主体 */
                #EEDFFE 100%     /* 底部 */
            );
            min-height: 100vh;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }
        .page {
            display: none;
            min-height: 100vh;
            padding: 0 20px 40px;
            max-width: 430px;
            margin: 0 auto;
            animation: fadeIn 0.4s ease;
        }
        .page.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Header - 和背景融为一体 */
        .header {
            padding-top: 16px;  /* 减少顶部间距，更贴近标题栏 */
            padding-bottom: 20px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: #1F2937;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 14px;
            color: #8B5CF6;
            font-weight: 500;
        }
        
        /* Card */
        .card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 32px 20px;
            box-shadow: 
                0 1px 2px rgba(139, 92, 246, 0.05),
                0 8px 32px rgba(139, 92, 246, 0.08);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #8B5CF6, #A78BFA, #C4B5FD);
        }
        
        /* Icon */
        .card-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #F3E8FF 0%, #EDE9FE 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            position: relative;
        }
        .card-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(139,92,246,0.1), transparent);
            z-index: -1;
        }
        .card-icon svg {
            width: 32px;
            height: 32px;
            color: #7C3AED;
        }
        .card-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 4px;
        }
        .card-subtitle {
            text-align: center;
            font-size: 13px;
            color: #A78BFA;
            margin-bottom: 28px;
        }
        
        /* AP List Header */
        .ap-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
        }
        .ap-list-header span {
            font-size: 13px;
            color: #9CA3AF;
            font-weight: 500;
        }
        .refresh-btn {
            font-size: 13px;
            color: #7C3AED;
            background: rgba(139, 92, 246, 0.08);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .refresh-btn:active {
            transform: scale(0.95);
            background: rgba(139, 92, 246, 0.15);
        }
        .refresh-btn svg {
            width: 14px;
            height: 14px;
        }
        .refresh-btn.spinning svg {
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* AP Items */
        .ap-item {
            display: flex;
            align-items: center;
            padding: 14px 14px;
            background: #FAF7FF;
            border: 1.5px solid transparent;
            border-radius: 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            animation: slideUp 0.3s ease both;
        }
        .ap-item:nth-child(1) { animation-delay: 0.05s; }
        .ap-item:nth-child(2) { animation-delay: 0.1s; }
        .ap-item:nth-child(3) { animation-delay: 0.15s; }
        .ap-item:nth-child(4) { animation-delay: 0.2s; }
        .ap-item:nth-child(5) { animation-delay: 0.25s; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .ap-item:hover, .ap-item:active {
            background: #F3E8FF;
            border-color: #DDD6FE;
            transform: translateX(4px);
            box-shadow: 0 2px 12px rgba(139, 92, 246, 0.08);
        }
        
        /* Signal Strength */
        .ap-signal {
            width: 28px;
            height: 28px;
            margin-right: 12px;
            flex-shrink: 0;
            position: relative;
        }
        .signal-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 20px;
            justify-content: center;
        }
        .signal-bar {
            width: 4px;
            border-radius: 2px;
            background: #DDD6FE;
            transition: all 0.3s;
        }
        .signal-bar.active {
            background: linear-gradient(180deg, #8B5CF6, #A78BFA);
        }
        .signal-bar:nth-child(1) { height: 6px; }
        .signal-bar:nth-child(2) { height: 10px; }
        .signal-bar:nth-child(3) { height: 14px; }
        .signal-bar:nth-child(4) { height: 18px; }
        
        .ap-info {
            flex: 1;
            min-width: 0;
        }
        .ap-name {
            font-size: 15px;
            font-weight: 600;
            color: #1F2937;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ap-tag {
            font-size: 11px;
            margin-top: 2px;
            font-weight: 500;
        }
        .ap-tag.encrypted { color: #9CA3AF; }
        .ap-tag.open { color: #10B981; }
        .ap-tag.saved { color: #8B5CF6; }
        
        .ap-lock {
            width: 16px;
            height: 16px;
            color: #D1D5DB;
            margin-left: 6px;
            flex-shrink: 0;
        }
        .ap-arrow {
            width: 18px;
            height: 18px;
            color: #C4B5FD;
            margin-left: 4px;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .ap-item:hover .ap-arrow {
            transform: translateX(2px);
            color: #8B5CF6;
        }
        
        /* Skeleton Loading */
        .skeleton-item {
            display: flex;
            align-items: center;
            padding: 14px;
            background: #FAF7FF;
            border-radius: 16px;
            margin-bottom: 8px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .skeleton-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #E9D5FF;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .skeleton-lines {
            flex: 1;
        }
        .skeleton-line {
            height: 10px;
            background: #E9D5FF;
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .skeleton-line:last-child {
            width: 60%;
            height: 8px;
            margin-bottom: 0;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9CA3AF;
        }
        .empty-state svg {
            width: 48px;
            height: 48px;
            color: #DDD6FE;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 14px;
        }
        
        /* Selected AP */
        .selected-ap {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: linear-gradient(135deg, #FAF7FF 0%, #F3E8FF 100%);
            border: 1.5px solid #E9D5FF;
            border-radius: 16px;
            margin-bottom: 24px;
            position: relative;
        }
        .selected-ap::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 24px;
            background: linear-gradient(180deg, #8B5CF6, #A78BFA);
            border-radius: 0 2px 2px 0;
        }
        .selected-ap .ap-signal { margin-right: 12px; }
        .selected-ap .ap-name { font-size: 15px; font-weight: 600; color: #1F2937; }
        .selected-ap .ap-tag { font-size: 12px; color: #8B5CF6; margin-top: 2px; font-weight: 500; }
        
        /* Input */
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #6B7280;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap input {
            width: 100%;
            padding: 14px 48px 14px 16px;
            font-size: 15px;
            border: 2px solid #F3E8FF;
            border-radius: 14px;
            outline: none;
            transition: all 0.2s;
            background: #FAFAFA;
            color: #1F2937;
        }
        .input-wrap input:focus {
            border-color: #8B5CF6;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }
        .input-wrap input::placeholder {
            color: #C4B5FD;
        }
        .input-wrap .toggle-pwd {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            color: #C4B5FD;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            transition: color 0.2s;
        }
        .input-wrap .toggle-pwd:active {
            color: #8B5CF6;
        }
        .error-msg {
            font-size: 12px;
            color: #EF4444;
            margin-top: 8px;
            min-height: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .error-msg::before {
            content: '⚠';
            font-size: 12px;
        }
        
        /* Button */
        .btn-primary {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            color: #FFFFFF;
            background: linear-gradient(135deg, #7C3AED 0%, #A855F7 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-primary:active::after {
            left: 100%;
        }
        .btn-primary:disabled {
            background: #E5E7EB;
            color: #9CA3AF;
            cursor: not-allowed;
            transform: none;
        }
        .btn-text {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 14px;
            color: #A78BFA;
            background: none;
            border: none;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .btn-text:active {
            color: #7C3AED;
        }
        
        /* Loading Overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        .loading-overlay.show { display: flex; }
        .loading-spinner {
            width: 48px;
            height: 48px;
            position: relative;
        }
        .loading-spinner::before,
        .loading-spinner::after {
            content: '';
            position: absolute;
            border-radius: 50%;
        }
        .loading-spinner::before {
            width: 48px;
            height: 48px;
            border: 3px solid #F3E8FF;
        }
        .loading-spinner::after {
            width: 48px;
            height: 48px;
            border: 3px solid transparent;
            border-top-color: #8B5CF6;
            animation: spin 0.8s linear infinite;
        }
        .loading-text {
            font-size: 15px;
            color: #6B7280;
            font-weight: 500;
        }
        .loading-dots {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .loading-dot {
            width: 6px;
            height: 6px;
            background: #C4B5FD;
            border-radius: 50%;
            animation: dotPulse 1.4s infinite ease-in-out both;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(31, 41, 55, 0.92);
            color: white;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">连接中</div>
        <div class="loading-dots">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <!-- Page 1: WiFi List -->
    <div class="page active" id="page-list">
        <div class="header">
            <h1>设备配网</h1>
            <p>为你的设备连接 Wi-Fi 网络</p>
        </div>
        <div class="card">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                    <line x1="12" y1="20" x2="12.01" y2="20"/>
                </svg>
            </div>
            <div class="card-title">选择 Wi-Fi 网络</div>
            <div class="card-subtitle">选择附近的 Wi-Fi 网络</div>
            <div class="ap-list-header">
                <span>附近网络</span>
                <button class="refresh-btn" id="refreshBtn" onclick="loadAPList(true)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"/>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                    </svg>
                    刷新
                </button>
            </div>
            <div id="apList">
                <div class="skeleton-item">
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-lines">
                        <div class="skeleton-line" style="width: 40%;"></div>
                        <div class="skeleton-line"></div>
                    </div>
                </div>
                <div class="skeleton-item">
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-lines">
                        <div class="skeleton-line" style="width: 50%;"></div>
                        <div class="skeleton-line"></div>
                    </div>
                </div>
                <div class="skeleton-item">
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-lines">
                        <div class="skeleton-line" style="width: 35%;"></div>
                        <div class="skeleton-line"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Page 2: Password Input -->
    <div class="page" id="page-pwd">
        <div class="header">
            <h1>设备配网</h1>
            <p>为你的设备连接 Wi-Fi 网络</p>
        </div>
        <div class="card">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <div class="card-title">输入 Wi-Fi 密码</div>
            <div class="selected-ap" id="selectedAp">
                <div class="ap-signal">
                    <div class="signal-bars">
                        <div class="signal-bar active"></div>
                        <div class="signal-bar active"></div>
                        <div class="signal-bar active"></div>
                        <div class="signal-bar active"></div>
                    </div>
                </div>
                <div class="ap-info">
                    <div class="ap-name" id="selectedSsid">--</div>
                    <div class="ap-tag">已选择</div>
                </div>
            </div>
            <div class="input-group">
                <label for="password">网络密码</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="请输入Wi-Fi密码" autocomplete="off">
                    <button class="toggle-pwd" onclick="togglePassword()" id="eyeBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <div class="error-msg" id="pwdError"></div>
            </div>
            <button class="btn-primary" id="connectBtn" onclick="submitForm()">连接网络</button>
            <button class="btn-text" onclick="backToList()">返回选择其他网络</button>
        </div>
    </div>

    <script>
        let currentSsid = '';
        let currentAuth = 0;
        let support5G = false;

        function showPage(name) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + name).classList.add('active');
        }

        function getSignalStrength(rssi) {
            if (rssi >= -50) return 4;
            if (rssi >= -60) return 3;
            if (rssi >= -70) return 2;
            if (rssi >= -80) return 1;
            return 1;
        }

        function getSignalSvg(rssi) {
            const strength = getSignalStrength(rssi);
            const bars = [1, 2, 3, 4].map(i => 
                `<div class="signal-bar ${i <= strength ? 'active' : ''}"></div>`
            ).join('');
            return `<div class="ap-signal"><div class="signal-bars">${bars}</div></div>`;
        }

        function renderAPList(data) {
            const container = document.getElementById('apList');
            if (!data.aps || data.aps.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <p>未找到可用网络，请检查设备附近是否有Wi-Fi</p>
                    </div>`;
                return;
            }
            let html = '';
            data.aps.forEach((ap, index) => {
                const isOpen = ap.authmode === 0;
                const tagClass = isOpen ? 'open' : 'encrypted';
                const tagText = isOpen ? '开放网络 · 无需密码' : '加密网络';
                const lockIcon = isOpen ? '' : `<svg class="ap-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
                html += `<div class="ap-item" style="animation-delay: ${index * 0.05}s" onclick="selectAP('${ap.ssid.replace(/'/g, "\\'")}', ${ap.authmode})">
                    ${getSignalSvg(ap.rssi)}
                    <div class="ap-info">
                        <div class="ap-name">${ap.ssid}</div>
                        <div class="ap-tag ${tagClass}">${tagText}</div>
                    </div>
                    ${lockIcon}
                    <svg class="ap-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </div>`;
            });
            container.innerHTML = html;
        }

        function loadAPList(manual) {
            const btn = document.getElementById('refreshBtn');
            if (manual) {
                btn.classList.add('spinning');
                document.getElementById('apList').innerHTML = `
                    <div class="skeleton-item"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line" style="width: 40%;"></div><div class="skeleton-line"></div></div></div>
                    <div class="skeleton-item"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line" style="width: 50%;"></div><div class="skeleton-line"></div></div></div>
                    <div class="skeleton-item"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line" style="width: 35%;"></div><div class="skeleton-line"></div></div></div>`;
            }
            fetch('/scan')
                .then(r => r.json())
                .then(data => {
                    support5G = data.support_5g;
                    renderAPList(data);
                })
                .catch(err => {
                    console.error('Scan error:', err);
                    if (manual) showToast('刷新失败，请重试');
                })
                .finally(() => {
                    if (manual) btn.classList.remove('spinning');
                });
        }

        function selectAP(ssid, authmode) {
            currentSsid = ssid;
            currentAuth = authmode;
            if (authmode === 0) {
                document.getElementById('password').value = '';
                submitForm();
                return;
            }
            document.getElementById('selectedSsid').textContent = ssid;
            document.getElementById('password').value = '';
            document.getElementById('pwdError').textContent = '';
            document.getElementById('connectBtn').disabled = false;
            showPage('pwd');
        }

        function backToList() {
            showPage('list');
            currentSsid = '';
            currentAuth = 0;
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const btn = document.getElementById('eyeBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line x1="4.22" y1="4.22" x2="19.78" y2="19.78"/></svg>`;
            } else {
                input.type = 'password';
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            }
        }

        async function submitForm() {
            const pwd = document.getElementById('password').value;
            const errorEl = document.getElementById('pwdError');
            const btn = document.getElementById('connectBtn');
            if (currentAuth !== 0 && pwd.length < 8) {
                errorEl.textContent = '密码至少需要 8 位';
                return;
            }
            errorEl.textContent = '';
            btn.disabled = true;
            showLoading('正在连接网络');
            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ssid: currentSsid, password: pwd })
                });
                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || '连接失败');
                }
                hideLoading();
                window.location.href = '/done.html';
            } catch (err) {
                hideLoading();
                errorEl.textContent = err.message;
                btn.disabled = false;
            }
        }

        function showLoading(text) {
            document.getElementById('loadingText').textContent = text || '加载中';
            document.getElementById('loadingOverlay').classList.add('show');
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAPList(false);
            setInterval(() => loadAPList(false), 5000);
        });
    </script>
</body>
</html>
